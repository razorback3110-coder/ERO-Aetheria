name: ERO CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  preflight:
    name: ERO Static Preflight
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ERO
        uses: actions/checkout@v6
        with:
          lfs: true
          clean: true

      - name: Validate Unity project contract
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("Assets","Packages","ProjectSettings","ProjectSettings/ProjectVersion.txt")
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) { throw "Missing required path: $path" }
            Write-Host "OK: $path"
          }
          $version = (Get-Content "ProjectSettings/ProjectVersion.txt" -Raw).Trim()
          Write-Host "Unity version file: $version"
          if ($version -notmatch "6000\.0\.67f1") { throw "Expected Unity 6000.0.67f1" }
          $scripts = @(Get-ChildItem "Assets/ERO" -Recurse -Filter "*.cs" -File)
          Write-Host "ERO C# scripts: $($scripts.Count)"
          if ($scripts.Count -eq 0) { throw "No ERO C# scripts found" }

      - name: Validate commercial asset registry
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE\Tools\Validate-EROAssetRegistry.ps1"

      - name: Scan for accidental secrets
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $patterns = @("UNITY_PASSWORD=","DISCORD_TOKEN=","BEGIN RSA PRIVATE KEY","BEGIN OPENSSH PRIVATE KEY","ghp_")
          $files = Get-ChildItem Assets,Packages,ProjectSettings -Recurse -File -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            if ($f.Extension -in @('.png','.jpg','.jpeg','.tga','.fbx','.obj','.wav','.mp3','.ttf','.otf','.dll','.zip')) { continue }
            $text = Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
            foreach ($p in $patterns) {
              if ($text -and $text.Contains($p)) { throw "Possible secret pattern '$p' found in $($f.FullName)" }
            }
          }
          Write-Host "Secret scan: OK"

  validate:
    name: ERO Project Validation
    needs: preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - name: Checkout ERO
        uses: actions/checkout@v6
        with:
          lfs: true
          clean: false

      - name: Show environment
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          Write-Host "=== ERO CI ==="
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      - name: Validate Unity project
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("Assets","Packages","ProjectSettings","ProjectSettings/ProjectVersion.txt")
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path)) { throw "Missing required path: $path" }
            Write-Host "OK: $path"
          }
          $version = (Get-Content "ProjectSettings/ProjectVersion.txt" -Raw).Trim()
          Write-Host "Unity version file: $version"
          if ($version -notmatch "6000\.0\.67f1") { throw "Expected Unity 6000.0.67f1" }
          $scripts = @(Get-ChildItem "Assets/ERO" -Recurse -Filter "*.cs" -File)
          Write-Host "ERO C# scripts: $($scripts.Count)"
          if ($scripts.Count -eq 0) { throw "No ERO C# scripts found" }

      - name: Validate commercial asset registry
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE\Tools\Validate-EROAssetRegistry.ps1"

      - name: Scan for accidental secrets
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $patterns = @("UNITY_PASSWORD=","DISCORD_TOKEN=","BEGIN RSA PRIVATE KEY","BEGIN OPENSSH PRIVATE KEY","ghp_")
          $files = Get-ChildItem Assets,Packages,ProjectSettings -Recurse -File -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            if ($f.Extension -in @('.png','.jpg','.jpeg','.tga','.fbx','.obj','.wav','.mp3','.ttf','.otf','.dll','.zip')) { continue }
            $text = Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
            foreach ($p in $patterns) {
              if ($text -and $text.Contains($p)) { throw "Possible secret pattern '$p' found in $($f.FullName)" }
            }
          }
          Write-Host "Secret scan: OK"

      - name: Locate Unity 6000.0.67f1
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "6000.0.67f1"
          $candidates = New-Object System.Collections.Generic.List[string]
          if ($env:ERO_UNITY_EXE) { [void]$candidates.Add($env:ERO_UNITY_EXE) }
          $knownRoots = @(
            (Join-Path ${env:ProgramFiles} "Unity\Hub\Editor\$version\Editor\Unity.exe"),
            (Join-Path ${env:ProgramFiles} "Unity Hub\Editor\$version\Editor\Unity.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Unity\Hub\Editor\$version\Editor\Unity.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Unity Hub\Editor\$version\Editor\Unity.exe"),
            "C:\Unity\Hub\Editor\$version\Editor\Unity.exe",
            "D:\Unity\Hub\Editor\$version\Editor\Unity.exe",
            "D:\Program Files\Unity\Hub\Editor\$version\Editor\Unity.exe"
          )
          foreach ($candidate in $knownRoots) { if ($candidate) { [void]$candidates.Add($candidate) } }

          $unity = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ((Test-Path -LiteralPath $candidate -PathType Leaf) -and ($candidate -match '(?i)Unity\.exe$')) {
              $unity = $candidate
              break
            }
          }

          if (-not $unity) {
            $searchRoots = @("C:\Program Files\Unity", "C:\Program Files\Unity Hub", "C:\Unity", "D:\Unity", "D:\Program Files\Unity") | Where-Object { Test-Path -LiteralPath $_ -PathType Container }
            foreach ($root in $searchRoots) {
              $found = Get-ChildItem -LiteralPath $root -Filter "Unity.exe" -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "(?i)[\\/]$version[\\/]Editor[\\/]Unity\.exe$" } |
                Select-Object -First 1
              if ($found) { $unity = $found.FullName; break }
            }
          }

          if (-not $unity) { throw "Unity $version was not found on self-hosted runner. Set ERO_UNITY_EXE to the exact Unity.exe path or install the editor." }
          $productVersion = (Get-Item -LiteralPath $unity).VersionInfo.ProductVersion
          if ($productVersion -notmatch "^$version(?:\s|$)") { throw "Unity executable version mismatch. Expected $version, got '$productVersion' at $unity" }
          Write-Host "Unity found: $unity"
          Write-Host "Unity ProductVersion: $productVersion"
          "ERO_UNITY_EXE=$unity" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Initialize Unity project and rebuild Library when needed
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Builds\Logs" | Out-Null
          $log = "$env:GITHUB_WORKSPACE\Builds\Logs\unity-initialize.log"
          $library = Join-Path $env:GITHUB_WORKSPACE "Library"
          if ((Test-Path $library) -and ((Get-ChildItem $library -Force -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0) -and (Test-Path (Join-Path $library "SourceAssetDB"))) {
            Write-Host "Unity Library cache exists; reusing persistent self-hosted runner cache."
            exit 0
          }
          Write-Host "Unity Library is missing/empty. Performing first-time Unity import (up to 60 minutes)."
          $args = @(
            "-batchmode", "-accept-apiupdate",
            "-projectPath", "$env:GITHUB_WORKSPACE",
            "-buildTarget", "StandaloneWindows64",
            "-quit",
            "-logFile", $log
          )
          $p = Start-Process -FilePath "$env:ERO_UNITY_EXE" -ArgumentList $args -Wait -PassThru
          Write-Host "Unity initialization exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Write-Host "===== UNITY INITIALIZATION LOG ====="
            if (Test-Path $log) { Get-Content $log -Tail 400 }
            throw "Unity project initialization failed with exit code $($p.ExitCode)"
          }

      - name: Unity compile validation
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Builds\Logs" | Out-Null
          $log = "$env:GITHUB_WORKSPACE\Builds\Logs\ci-compile.log"
          $args = @(
            "-batchmode", "-accept-apiupdate",
            "-projectPath", "$env:GITHUB_WORKSPACE",
            "-buildTarget", "StandaloneWindows64",
            "-executeMethod", "EternalRealmsOnline.CI.EROBuildAutomation.ValidateCompile",
            "-quit",
            "-logFile", $log
          )
          $p = Start-Process -FilePath "$env:ERO_UNITY_EXE" -ArgumentList $args -Wait -PassThru
          Write-Host "Unity compile validation exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Write-Host "===== UNITY COMPILE LOG ====="
            if (Test-Path $log) { Get-Content $log -Tail 400 }
            throw "Unity compile validation failed with exit code $($p.ExitCode)"
          }

      - name: Upload Unity compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ERO-CI-Unity-Log-${{ github.sha }}
          path: Builds/Logs/ci-compile.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validation success
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          Write-Host "========================================"
          Write-Host " ERO CI VALIDATION SUCCESS"
          Write-Host "========================================"
