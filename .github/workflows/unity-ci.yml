name: ERO Unity Validation

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  ERO_UNITY_VERSION: 6000.0.67f1

jobs:
  project-preflight:
    name: Project preflight
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ERO
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify pinned Unity project version
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$expected = $env:ERO_UNITY_VERSION; $file = Join-Path $env:GITHUB_WORKSPACE 'ProjectSettings\ProjectVersion.txt'; if (-not (Test-Path $file)) { throw 'ProjectSettings\ProjectVersion.txt not found' }; $line = Get-Content -Raw -Encoding UTF8 $file | Select-String -Pattern 'm_EditorVersion:\s*([^\r\n]+)' | Select-Object -First 1; if (-not $line) { throw 'm_EditorVersion is missing from ProjectSettings/ProjectVersion.txt' }; $actual = $line.Matches[0].Groups[1].Value.Trim(); Write-Host ('Project Unity version: ' + $actual); if ($actual -ne $expected) { throw ('Expected Unity ' + $expected + ' but project declares ' + $actual) }"

      - name: Verify Unity project structure
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ero-ci-run.ps1 -Action preflight

      - name: Check accidental secrets
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ero-ci-run.ps1 -Action secrets

  unity-validation:
    name: Unity compile validation
    needs: project-preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout ERO
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify pinned Unity project version
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$expected = $env:ERO_UNITY_VERSION; $file = Join-Path $env:GITHUB_WORKSPACE 'ProjectSettings\ProjectVersion.txt'; if (-not (Test-Path $file)) { throw 'ProjectSettings\ProjectVersion.txt not found' }; $line = Get-Content -Raw -Encoding UTF8 $file | Select-String -Pattern 'm_EditorVersion:\s*([^\r\n]+)' | Select-Object -First 1; if (-not $line) { throw 'm_EditorVersion is missing from ProjectSettings/ProjectVersion.txt' }; $actual = $line.Matches[0].Groups[1].Value.Trim(); if ($actual -ne $expected) { throw ('Expected Unity ' + $expected + ' but project declares ' + $actual) }"

      - name: Resolve Unity executable
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ero-ci-run.ps1 -Action resolve-unity

      - name: Stop stale Unity/Bee processes
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ero-ci-run.ps1 -Action stop-processes

      - name: Validate Unity compile
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ero-ci-run.ps1 -Action validate

      - name: Cleanup temporary Unity/Bee data
        if: always()
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\ero-ci-run.ps1 -Action cleanup

      - name: Upload Unity validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ero-unity-validation-log
          path: Logs/ERO_Unity_Validation.log
          if-no-files-found: ignore
