name: ERO Build Windows + Server

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ERO
    runs-on: [self-hosted, Windows, X64, ERO-Unity]
    timeout-minutes: 120

    steps:
      - name: Checkout ERO
        uses: actions/checkout@v6
        with:
          lfs: true
          clean: true

      - name: Locate Unity 6000.0.67f1
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $candidates = @(
            $env:ERO_UNITY_EXE,
            "C:\Program Files\Unity\Hub\Editor\6000.0.67f1\Editor\Unity.exe",
            "C:\Program Files\Unity Hub\Editor\6000.0.67f1\Editor\Unity.exe",
            "$env:ProgramFiles\Unity Hub\Editor\6000.0.67f1\Editor\Unity.exe"
          ) | Where-Object { $_ -and $_.Trim() -ne "" }
          $unity = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $unity) { throw "Unity 6000.0.67f1 was not found. Set ERO_UNITY_EXE to the exact Unity.exe path." }
          "ERO_UNITY_EXE=$unity" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Unity: $unity"
          & $unity -version

      - name: Validate Unity compile
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Builds\Logs" | Out-Null
          $args = @("-batchmode","-accept-apiupdate","-projectPath","$env:GITHUB_WORKSPACE","-buildTarget","StandaloneWindows64","-executeMethod","EternalRealmsOnline.CI.EROBuildAutomation.ValidateCompile","-quit","-logFile","$env:GITHUB_WORKSPACE\Builds\Logs\compile.log")
          $p = Start-Process -FilePath "$env:ERO_UNITY_EXE" -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:GITHUB_WORKSPACE\Builds\Logs\compile.log" -Tail 400; throw "Unity compile/validation failed with exit code $($p.ExitCode)" }

      - name: Build Windows Player
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $args = @("-batchmode","-accept-apiupdate","-projectPath","$env:GITHUB_WORKSPACE","-buildTarget","StandaloneWindows64","-executeMethod","EternalRealmsOnline.CI.EROBuildAutomation.BuildWindows","-quit","-logFile","$env:GITHUB_WORKSPACE\Builds\Logs\windows.log")
          $p = Start-Process -FilePath "$env:ERO_UNITY_EXE" -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:GITHUB_WORKSPACE\Builds\Logs\windows.log" -Tail 500; throw "Windows build failed with exit code $($p.ExitCode)" }

      - name: Build Linux Dedicated Server
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $args = @("-batchmode","-accept-apiupdate","-nographics","-projectPath","$env:GITHUB_WORKSPACE","-buildTarget","StandaloneLinux64","-executeMethod","EternalRealmsOnline.CI.EROBuildAutomation.BuildLinuxDedicatedServer","-quit","-logFile","$env:GITHUB_WORKSPACE\Builds\Logs\linux-server.log")
          $p = Start-Process -FilePath "$env:ERO_UNITY_EXE" -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:GITHUB_WORKSPACE\Builds\Logs\linux-server.log" -Tail 500; throw "Linux Dedicated Server build failed with exit code $($p.ExitCode)" }

      - name: Verify outputs
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          if (!(Test-Path "Builds/Windows/ERO.exe")) { throw "Windows build output missing." }
          if (!(Test-Path "Builds/LinuxServer/ERO-WorldServer.x86_64")) { throw "Linux server output missing." }
          Write-Host "Windows build: OK"
          Write-Host "Linux server build: OK"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ERO-Windows-${{ github.sha }}
          path: Builds/Windows
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux server build
        uses: actions/upload-artifact@v4
        with:
          name: ERO-LinuxServer-${{ github.sha }}
          path: Builds/LinuxServer
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ERO-Unity-Logs-${{ github.sha }}
          path: Builds/Logs
          if-no-files-found: warn
          retention-days: 14
