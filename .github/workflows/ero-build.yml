name: ERO Build Windows + Server

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  ERO_UNITY_VERSION: 6000.0.67f1

jobs:
  build:
    name: Build ERO
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240

    steps:
      - name: Checkout ERO
        uses: actions/checkout@v6
        with:
          lfs: true
          clean: false

      - name: Locate and verify Unity 6000.0.67f1
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:ERO_UNITY_VERSION
          $candidates = @(
            $env:ERO_UNITY_EXE,
            "C:\Program Files\Unity\Hub\Editor\$version\Editor\Unity.exe",
            "C:\Program Files\Unity Hub\Editor\$version\Editor\Unity.exe",
            "$env:ProgramFiles\Unity Hub\Editor\$version\Editor\Unity.exe"
          ) | Where-Object { $_ -and $_.Trim() -ne "" }
          $unity = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $unity) { throw "Unity $version was not found. Set ERO_UNITY_EXE to the exact Unity.exe path." }
          $productVersion = (Get-Item -LiteralPath $unity).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($productVersion) -or -not ($productVersion -match "^$([regex]::Escape($version))(?:\s|_|$)")) {
            throw "Unity executable version mismatch. Expected $version, got '$productVersion' at $unity"
          }
          "ERO_UNITY_EXE=$unity" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ERO_UNITY_PRODUCT_VERSION=$productVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Unity: $unity"
          Write-Host "Unity ProductVersion: $productVersion"
          & $unity -version

      - name: Initialize Unity project and rebuild Library when needed
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Builds\Logs" | Out-Null
          $log = "$env:GITHUB_WORKSPACE\Builds\Logs\unity-initialize.log"
          $library = Join-Path $env:GITHUB_WORKSPACE "Library"
          if ((Test-Path $library) -and ((Get-ChildItem $library -Force -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0) -and (Test-Path (Join-Path $library "SourceAssetDB"))) {
            Write-Host "Unity Library cache exists; reusing persistent runner cache."
            exit 0
          }
          Write-Host "Unity Library missing/empty; importing project (up to 60 minutes)."
          $args = @("-batchmode","-accept-apiupdate","-projectPath","$env:GITHUB_WORKSPACE","-buildTarget","StandaloneWindows64","-quit","-logFile",$log)
          $p = Start-Process -FilePath "$env:ERO_UNITY_EXE" -ArgumentList $args -Wait -PassThru
          Write-Host "Unity initialization exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log -Tail 400 }; throw "Unity initialization failed with exit code $($p.ExitCode)" }

      - name: Validate Unity compile
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Builds\Logs" | Out-Null
          $log = "$env:GITHUB_WORKSPACE\Builds\Logs\compile.log"
          $args = @("-batchmode","-accept-apiupdate","-projectPath","$env:GITHUB_WORKSPACE","-buildTarget","StandaloneWindows64","-executeMethod","EternalRealmsOnline.CI.EROBuildAutomation.ValidateCompile","-quit","-logFile",$log)
          $p = Start-Process -FilePath "$env:ERO_UNITY_EXE" -ArgumentList $args -Wait -PassThru
          Write-Host "Compile validation exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 500; throw "Unity compile/validation failed with exit code $($p.ExitCode)" }
          if (Test-Path $log) {
            $compileErrors = Select-String -Path $log -Pattern 'error CS\d+|Compilation failed|script compilation failed' -CaseSensitive:$false
            if ($compileErrors) {
              $compileErrors | Select-Object -Last 40 | ForEach-Object { Write-Host $_.Line }
              throw "Unity log contains compiler failure markers despite a zero process exit code."
            }
          }

      - name: Build playable Windows client
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        timeout-minutes: 120
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\Builds\Windows" | Out-Null
          $log = "$env:GITHUB_WORKSPACE\Builds\Logs\windows.log"
          $args = @("-batchmode","-accept-apiupdate","-projectPath","$env:GITHUB_WORKSPACE","-buildTarget","StandaloneWindows64","-executeMethod","EternalRealmsOnline.CI.EROBuildAutomation.BuildWindows","-quit","-logFile",$log)
          $p = Start-Process -FilePath "$env:ERO_UNITY_EXE" -ArgumentList $args -Wait -PassThru
          Write-Host "Windows build exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log -Tail 700 }; throw "Windows build failed with exit code $($p.ExitCode)" }

      - name: Verify Windows playable output
        shell: powershell -ExecutionPolicy Bypass -NoProfile -File {0}
        run: |
          if (!(Test-Path "Builds/Windows/ERO.exe")) { throw "Windows build output missing: Builds/Windows/ERO.exe" }
          Write-Host "PLAYABLE WINDOWS CLIENT: OK"

      - name: Upload Windows playable client
        uses: actions/upload-artifact@v4
        with:
          name: ERO-Windows-Playable-${{ github.sha }}
          path: Builds/Windows
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ERO-Unity-Logs-${{ github.sha }}
          path: Builds/Logs
          if-no-files-found: warn
          retention-days: 14
