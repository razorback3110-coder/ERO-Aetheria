name: ERO Playable Today

on:
  workflow_dispatch:

concurrency:
  group: ero-playable-manual
  cancel-in-progress: true

permissions:
  contents: read

env:
  ERO_UNITY_VERSION: 6000.0.67f1
  ERO_UNITY_REVISION: 78a1c2bbeb6a

jobs:
  playable:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          clean: true

      - name: Validate repository and legal gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionFile = Join-Path $env:GITHUB_WORKSPACE 'ProjectSettings\ProjectVersion.txt'
          $registry = Join-Path $env:GITHUB_WORKSPACE 'Assets\ERO\Legal\ERO_Asset_License_Registry.md'
          if (-not (Test-Path -LiteralPath $versionFile -PathType Leaf)) { throw 'Missing ProjectSettings/ProjectVersion.txt' }
          if (-not (Test-Path -LiteralPath $registry -PathType Leaf)) { throw 'Missing Assets/ERO/Legal/ERO_Asset_License_Registry.md' }
          $lines = Get-Content -LiteralPath $versionFile
          $versionLine = $lines | Where-Object { $_ -match '^m_EditorVersion:\s*' } | Select-Object -First 1
          $revisionLine = $lines | Where-Object { $_ -match '^m_EditorVersionWithRevision:\s*' } | Select-Object -First 1
          $actual = ($versionLine -replace '^m_EditorVersion:\s*','').Trim()
          $actualWithRevision = ($revisionLine -replace '^m_EditorVersionWithRevision:\s*','').Trim()
          $expectedWithRevision = "$env:ERO_UNITY_VERSION ($env:ERO_UNITY_REVISION)"
          if ($actual -ne $env:ERO_UNITY_VERSION) { throw "Expected Unity $env:ERO_UNITY_VERSION but project declares $actual" }
          if ($actualWithRevision -ne $expectedWithRevision) { throw "Expected Unity revision $expectedWithRevision but project declares $actualWithRevision" }
          $legalText = Get-Content -LiteralPath $registry -Raw
          if ($legalText -notmatch '(?m)^# ERO Asset & License Registry') { throw 'Asset license registry header is missing' }
          if ($legalText -notmatch 'Only assets with a verified license permitting use in a commercial game') { throw 'Commercial-license policy is missing from the asset registry' }

      - name: Locate Unity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:ERO_UNITY_VERSION
          $paths = @(
            $env:ERO_UNITY_EXE,
            "C:\Program Files\Unity\Hub\Editor\$version\Editor\Unity.exe",
            "C:\Program Files\Unity Hub\Editor\$version\Editor\Unity.exe",
            "C:\Unity\Hub\Editor\$version\Editor\Unity.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          $unity = $paths | Select-Object -First 1
          if (-not $unity) { throw "Unity $version not found. Set ERO_UNITY_EXE to the full path of Unity.exe." }
          $productVersion = (Get-Item -LiteralPath $unity).VersionInfo.ProductVersion
          if ($productVersion -notmatch "^$([regex]::Escape($version))(\s|_|$)") { throw "Unity executable version mismatch: expected $version, got $productVersion" }
          "UNITY=$unity" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import project if needed
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'Library\SourceAssetDB') { exit 0 }
          New-Item -ItemType Directory -Force -Path 'Builds\Logs' | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE 'Builds\Logs\import.log'
          $p = Start-Process -FilePath $env:UNITY -ArgumentList @('-batchmode','-accept-apiupdate','-projectPath',$env:GITHUB_WORKSPACE,'-buildTarget','StandaloneWindows64','-quit','-logFile',$log) -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content -LiteralPath $log -Tail 500 }; throw "Unity import failed with exit code $($p.ExitCode)" }

      - name: Validate compile
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'Builds\Logs' | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE 'Builds\Logs\compile-validation.log'
          $p = Start-Process -FilePath $env:UNITY -ArgumentList @('-batchmode','-nographics','-accept-apiupdate','-projectPath',$env:GITHUB_WORKSPACE,'-buildTarget','StandaloneWindows64','-executeMethod','EternalRealmsOnline.CI.EROBuildAutomation.ValidateCompile','-quit','-logFile',$log) -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content -LiteralPath $log -Tail 1000 }; throw "Unity compile validation failed with exit code $($p.ExitCode)" }

      - name: Build playable Windows client
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'Builds\Windows','Builds\Logs' | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE 'Builds\Logs\playable.log'
          $p = Start-Process -FilePath $env:UNITY -ArgumentList @('-batchmode','-nographics','-accept-apiupdate','-projectPath',$env:GITHUB_WORKSPACE,'-buildTarget','StandaloneWindows64','-executeMethod','EternalRealmsOnline.CI.EROBuildAutomation.BuildWindows','-quit','-logFile',$log) -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content -LiteralPath $log -Tail 1500 }; throw "Playable build failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath 'Builds\Windows\ERO.exe' -PathType Leaf)) { throw 'ERO.exe was not produced' }

      - name: Upload Unity diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ERO-Playable-Logs-${{ github.sha }}
          path: Builds/Logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload playable client
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ERO-Playable-Windows-${{ github.sha }}
          path: Builds/Windows
          if-no-files-found: error
