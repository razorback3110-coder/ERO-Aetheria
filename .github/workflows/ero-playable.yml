name: ERO Playable Today

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playable:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          clean: false

      - name: Locate Unity
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$paths = @($env:ERO_UNITY_EXE, 'C:\Program Files\Unity\Hub\Editor\6000.0.67f1\Editor\Unity.exe', 'C:\Program Files\Unity Hub\Editor\6000.0.67f1\Editor\Unity.exe'); $unity = $paths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1; if (-not $unity) { throw 'Unity 6000.0.67f1 not found' }; 'UNITY=' + $unity | Out-File $env:GITHUB_ENV -Append; & $unity -version; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"

      - name: Import project if needed
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "if (Test-Path 'Library\SourceAssetDB') { Write-Host 'Unity Library already imported.'; exit 0 }; New-Item -ItemType Directory -Force -Path 'Builds\Logs' | Out-Null; $log = Join-Path $env:GITHUB_WORKSPACE 'Builds\Logs\import.log'; Write-Host 'Starting cold Unity import...'; $p = Start-Process -FilePath $env:UNITY -ArgumentList @('-batchmode','-accept-apiupdate','-projectPath', $env:GITHUB_WORKSPACE,'-buildTarget','StandaloneWindows64','-quit','-logFile',$log) -Wait -PassThru; Write-Host ('Unity import exit code: ' + $p.ExitCode); if (Test-Path $log) { Get-Content $log -Tail 500 }; if ($p.ExitCode -ne 0) { throw ('Unity import failed with exit code ' + $p.ExitCode) }"

      - name: Build playable Windows client
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "New-Item -ItemType Directory -Force -Path 'Builds\Windows','Builds\Logs' | Out-Null; $log = Join-Path $env:GITHUB_WORKSPACE 'Builds\Logs\playable.log'; $p = Start-Process -FilePath $env:UNITY -ArgumentList @('-batchmode','-accept-apiupdate','-projectPath', $env:GITHUB_WORKSPACE,'-buildTarget','StandaloneWindows64','-executeMethod','EternalRealmsOnline.CI.EROBuildAutomation.BuildWindows','-quit','-logFile',$log) -Wait -PassThru; Write-Host ('Unity build exit code: ' + $p.ExitCode); if (Test-Path $log) { Get-Content $log -Tail 1000 }; if ($p.ExitCode -ne 0) { throw ('Playable build failed with exit code ' + $p.ExitCode) }; if (-not (Test-Path 'Builds\Windows\ERO.exe')) { throw 'ERO.exe was not produced' }"

      - name: Upload playable client
        uses: actions/upload-artifact@v4
        with:
          name: ERO-Playable-Windows-${{ github.sha }}
          path: Builds/Windows
          if-no-files-found: error
